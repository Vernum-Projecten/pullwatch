name: CI

# Every pull request and every push to main: the shell scripts and the
# workflows are linted, a pull request that changes the app carries a
# changelog fragment (changelog.d/README.md), PullwatchKit's tests run, the app is built and its
# unit and UI tests run, the String Catalogs are checked against the code,
# and an unsigned universal release is packaged the way
# scripts/release/release.sh packages a real one. No job needs a secret.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The xcode-27 image is Apple Silicon on macOS 27; the app needs Xcode 27.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  guards:
    name: shell scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (style floor)
        run: shellcheck --severity=style scripts/*/*.sh .claude/hooks/*.sh .githooks/*
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of actionlint_<version>_linux_amd64.tar.gz from the release's
          # checksums.txt; update both lines together.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  changelog:
    name: changelog fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the changelog scripts prove themselves
        run: |
          bash scripts/release/changelog.sh --self-test
          bash scripts/checks/changelog-guard.sh --self-test
      # The label waives the fragment, never the fragments' form.
      - name: every fragment is well formed
        run: bash scripts/release/changelog.sh --check
      # The label comes from the event, so setting it needs a new push or a
      # reopened pull request; a re-run replays the old event.
      - name: a fragment for a change to the app, no line under [Unreleased]
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          WAIVED: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          if [ "$WAIVED" = "true" ]; then
            bash scripts/checks/changelog-guard.sh --waived "$BASE" "$HEAD"
          else
            bash scripts/checks/changelog-guard.sh "$BASE" "$HEAD"
          fi

  kit:
    name: PullwatchKit tests
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Warnings are errors here: the Swift 6.4 settings (ExistentialAny and the
      # concurrency features) keep the code clean only if nothing slips back.
      - name: swift test
        run: swift test --package-path PullwatchKit -Xswiftc -warnings-as-errors

  app:
    name: app build, unit and UI tests
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ad-hoc signed, as the project already is: the tests need a signed
      # app, not a Developer ID.
      - name: build and run the unit and UI tests
        run: |
          xcodebuild test -project Pullwatch/Pullwatch.xcodeproj -scheme Pullwatch \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: build/Tests.xcresult/
          if-no-files-found: warn

  strings:
    name: String Catalogs in step with the code
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # LocalizationTests only sees text that is in a catalog, and new text only
      # gets there through sync-strings.sh. If the script changes a catalog,
      # someone added or removed text without syncing (and translating) it.
      - name: sync-strings.sh changes nothing
        run: |
          bash scripts/dev/sync-strings.sh
          if ! git diff --exit-code --stat -- '*.xcstrings'; then
            echo "::error::The String Catalogs are not in step with the code. Run bash scripts/dev/sync-strings.sh, add the English, German and French for every new entry, and commit the catalogs."
            git diff -- '*.xcstrings' | head -80
            exit 1
          fi

  package:
    name: unsigned release build and disk image
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same script as a real release, without the Developer ID: a
      # universal Release build, the install window laid out by Finder, the
      # zip. A release tag then only adds signing and notarisation.
      - name: release.sh --unsigned
        run: scripts/release/release.sh --unsigned
      - name: the app is universal
        run: |
          binary=build/Build/Products/Release/Pullwatch.app/Contents/MacOS/Pullwatch
          archs="$(lipo -archs "$binary")"
          echo "architectures: $archs"
          for arch in arm64 x86_64; do
            [[ " $archs " == *" $arch "* ]] || { echo "Pullwatch.app has no $arch slice" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
