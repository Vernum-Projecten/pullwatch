name: CI

# Every pull request and every push to main: the shell scripts and the
# workflows are linted, PullwatchKit's tests run, the app is built and its
# unit and UI tests run, the String Catalogs are checked against the code,
# and an unsigned universal release is packaged the way
# scripts/release/release.sh packages a real one. No job needs a secret.
# The changelog fragment check is changelog.yml: it also runs when a label
# changes, which must not restart (and cancel) this whole workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The xcode-27 image is Apple Silicon on macOS 27; the app needs Xcode 27.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  guards:
    name: shell scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (style floor)
        run: shellcheck --severity=style scripts/*/*.sh .claude/hooks/*.sh .githooks/*
      # Every package in Package.resolved is acknowledged in the app (with its
      # licence and the resolved version) or listed as not linked (#166).
      - name: acknowledgements complete
        run: |
          bash scripts/checks/acknowledgements.sh --self-test
          bash scripts/checks/acknowledgements.sh
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of actionlint_<version>_linux_amd64.tar.gz from the release's
          # checksums.txt; update both lines together.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  kit:
    name: PullwatchKit tests
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Warnings are errors here: the Swift 6.4 settings (ExistentialAny and the
      # concurrency features) keep the code clean only if nothing slips back.
      - name: swift test
        run: swift test --package-path PullwatchKit -Xswiftc -warnings-as-errors

  app:
    name: app build, unit and UI tests
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ad-hoc signed, as the project already is: the tests need a signed
      # app, not a Developer ID. Warnings are errors through the project's
      # SWIFT_TREAT_WARNINGS_AS_ERRORS; on the command line it would also reach
      # the MCP SDK's packages, which Xcode builds with -suppress-warnings.
      - name: build and run the unit and UI tests
        run: |
          xcodebuild test -project Pullwatch/Pullwatch.xcodeproj -scheme Pullwatch \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: build/Tests.xcresult/
          if-no-files-found: warn

  strings:
    name: String Catalogs in step with the code
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # LocalizationTests only sees text that is in a catalog, and new text only
      # gets there through sync-strings.sh. If the script changes a catalog,
      # someone added or removed text without syncing (and translating) it.
      - name: sync-strings.sh changes nothing
        run: |
          bash scripts/dev/sync-strings.sh
          if ! git diff --exit-code --stat -- '*.xcstrings'; then
            echo "::error::The String Catalogs are not in step with the code. Run bash scripts/dev/sync-strings.sh, add the English, German and French for every new entry, and commit the catalogs."
            git diff -- '*.xcstrings' | head -80
            exit 1
          fi

  package:
    name: unsigned release build and disk image
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same script as a real release, without the Developer ID: a
      # universal Release build, the install window laid out by Finder, the
      # zip. A release tag then only adds signing and notarisation.
      - name: release.sh --unsigned
        run: scripts/release/release.sh --unsigned
      - name: the app and its agents helper are universal
        run: |
          app=build/Build/Products/Release/Pullwatch.app
          for binary in "$app/Contents/MacOS/Pullwatch" "$app/Contents/Helpers/pullwatch-mcp"; do
            archs="$(lipo -archs "$binary")"
            echo "$binary: $archs"
            for arch in arm64 x86_64; do
              [[ " $archs " == *" $arch "* ]] || { echo "$binary has no $arch slice" >&2; exit 1; }
            done
          done
      # The Release app ships without its symbol table (#230): the dSYM next
      # to the app keeps them for crash reports, and stays out of the files.
      - name: the app binary is stripped and the dSYM stays out
        run: |
          products=build/Build/Products/Release
          binary="$products/Pullwatch.app/Contents/MacOS/Pullwatch"
          echo "$binary: $(stat -f %z "$binary") bytes"
          for arch in arm64 x86_64; do
            locals="$(nm -a -arch "$arch" "$binary" | awk 'NF == 3 && $2 ~ /^[tdbs]$/' | wc -l | tr -d ' ')"
            exported="$(nm -gU -arch "$arch" "$binary" | wc -l | tr -d ' ')"
            echo "$arch: $locals local symbols, $exported exported symbols"
            [ "$locals" -le 10 ] || { echo "the $arch slice still has a local symbol table" >&2; exit 1; }
            [ "$exported" -eq 0 ] || { echo "the $arch slice still exports symbols (LD_EXPORT_SYMBOLS)" >&2; exit 1; }
          done
          test -d "$products/Pullwatch.app.dSYM" || { echo "no Pullwatch.app.dSYM" >&2; exit 1; }
          if unzip -l dist/Pullwatch-*.zip | grep -F ".dSYM"; then
            echo "a dSYM is in the zip" >&2
            exit 1
          fi
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/Pullwatch-*.dmg
          trap 'hdiutil detach "$mount"' EXIT
          if find "$mount" -name '*.dSYM' | grep .; then
            echo "a dSYM is in the disk image" >&2
            exit 1
          fi
          ls -l dist/
      # The helper an agent starts (pullwatch-mcp, #142) ships in both files,
      # with hardened runtime and its own identifier.
      - name: the helper is in the disk image and the zip
        run: |
          helper=Pullwatch.app/Contents/Helpers/pullwatch-mcp
          unzip -l dist/Pullwatch-*.zip | grep -F "$helper"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/Pullwatch-*.dmg
          trap 'hdiutil detach "$mount"' EXIT
          test -x "$mount/$helper"
          signature="$(codesign -dvv "$mount/$helper" 2>&1)"
          echo "$signature"
          grep -q "^Identifier=nl.torrisi.pullwatch.mcp$" <<<"$signature"
          grep -q "flags=.*runtime" <<<"$signature"
      # The licences of everything in the app (#166) ship in both files.
      - name: the acknowledgements are in the disk image and the zip
        run: |
          folder=Pullwatch.app/Contents/Resources/Acknowledgements
          files=(LICENSE NOTICE acknowledgements.json)
          while IFS= read -r file; do files+=("$file"); done < <(
            jq -r '.components[] | .file, (.notice // empty)' Pullwatch/Pullwatch/Acknowledgements/Resources/Acknowledgements/acknowledgements.json)
          listing="$(unzip -l dist/Pullwatch-*.zip)"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/Pullwatch-*.dmg
          trap 'hdiutil detach "$mount"' EXIT
          for file in "${files[@]}"; do
            grep -qF "$folder/$file" <<<"$listing" || { echo "$folder/$file is not in the zip" >&2; exit 1; }
            test -s "$mount/$folder/$file" || { echo "$folder/$file is not in the disk image" >&2; exit 1; }
          done
          echo "${#files[@]} acknowledgement files in the zip and the disk image"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
